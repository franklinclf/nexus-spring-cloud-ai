name: ai-cluster

services:

  ai-1:
    build: ./
    container_name: ai-1
    ports:
      - "8086:8086"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1" ]
      start_period: 15s
      interval: 5s
      timeout: 15s
      retries: 10
    environment:
      - API_KEY=${API_KEY}
      - SPRING_AI_OPENAI_EMBEDDING_API_KEY=${SPRING_AI_OPENAI_EMBEDDING_API_KEY}
      - REPLICA_ID=1
      - PORT=8086
    networks:
      - nexus-dev

  ai-2:
    build: ./
    container_name: ai-2
    ports:
      - "8087:8087"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1" ]
      start_period: 15s
      interval: 5s
      timeout: 15s
      retries: 10
    environment:
      - API_KEY=${API_KEY}
      - SPRING_AI_OPENAI_EMBEDDING_API_KEY=${SPRING_AI_OPENAI_EMBEDDING_API_KEY}
      - REPLICA_ID=2
      - PORT=8087
    networks:
      - nexus-dev

networks:
  nexus-dev:
    external: true